name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run links
      - run: bun install --frozen-lockfile
        working-directory: site
      # TypeDoc 0.28.20 needs minimatch 10, and the fix of this advisory is in minimatch 11 alone. The site's globs
      # are its own configuration. Remove the ignore once TypeDoc depends on a minimatch with the fix.
      - run: bun audit --ignore=GHSA-g3hv-75wg-m249
        working-directory: site
      # The build fails on a warning of TypeDoc by itself.
      - run: bun run build
        working-directory: site

  # `bun test`, its files dealt among four jobs that run at once. Each job runs its files alone on its runner, as one
  # job ran them all (decision 0242).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test --shard=${{ matrix.shard }}/4

  # The spikes, which `bun test` runs none of, on every push as at each move of Effect or Bun (decision 0250).
  spikes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:spikes

  # The tests of the storage and of the runtime on a server of PostgreSQL with a pool (decision 0222).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:postgres
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

  # Every seed of the explored tests, which a release passes, dealt among four jobs as `bun test` is. Run by hand from
  # the repository's Actions.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:release --shard=${{ matrix.shard }}/4

  # Every case of the files of `test:postgres` on a server of PostgreSQL with a pool, which the job `release` runs on
  # PGlite alone. PGlite runs one session, and hides what a pool does. Run by hand from the repository's Actions.
  release-postgres:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:postgres
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          SCHEDULES: all
